openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: dashboard
    description: Command center dashboard data
  - name: assets
    description: Asset inventory and lifecycle operations
  - name: maintenance
    description: Maintenance schedule data
  - name: locations
    description: Managed asset locations
  - name: people
    description: Asset custodians
  - name: departments
    description: Organisation departments
  - name: attachments
    description: Photos attached to assets and maintenance
  - name: users
    description: Application users and role-based access
  - name: audit
    description: Consolidated audit and activity logs
  - name: reports
    description: Compliance report workflow
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get dashboard summary
      responses:
        "200":
          description: Current inventory summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /dashboard/activity:
    get:
      operationId: getDashboardActivity
      tags: [dashboard]
      summary: Get recent asset activity
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/ActivityAction"
        - $ref: "#/components/parameters/ActivitySearch"
      responses:
        "200":
          description: Recent activity entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityEvent"
  /dashboard/maintenance:
    get:
      operationId: getDashboardMaintenance
      tags: [dashboard]
      summary: Get upcoming maintenance
      parameters:
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Upcoming maintenance rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MaintenanceItem"
  /assets:
    get:
      operationId: listAssets
      tags: [assets]
      summary: List and filter assets
      parameters:
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Status"
        - $ref: "#/components/parameters/Category"
        - $ref: "#/components/parameters/LocationId"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Paginated asset list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetListResponse"
    post:
      operationId: createAsset
      tags: [assets]
      summary: Create an asset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssetInput"
      responses:
        "201":
          description: Created asset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"
  /assets/{assetId}:
    get:
      operationId: getAsset
      tags: [assets]
      summary: Get an asset
      parameters:
        - $ref: "#/components/parameters/AssetId"
      responses:
        "200":
          description: Asset details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetDetail"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateAsset
      tags: [assets]
      summary: Update an asset
      parameters:
        - $ref: "#/components/parameters/AssetId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssetUpdate"
      responses:
        "200":
          description: Updated asset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteAsset
      tags: [assets]
      summary: Delete an asset (Admin and Manager)
      parameters:
        - $ref: "#/components/parameters/AssetId"
      responses:
        "204":
          description: Asset removed
        "404":
          $ref: "#/components/responses/NotFound"
  /assets/{assetId}/assign:
    post:
      operationId: assignAsset
      tags: [assets]
      summary: Assign an asset to a person and location
      parameters:
        - $ref: "#/components/parameters/AssetId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssetAssignmentInput"
      responses:
        "200":
          description: Assigned asset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetDetail"
        "404":
          $ref: "#/components/responses/NotFound"
  /assets/{assetId}/return:
    post:
      operationId: returnAsset
      tags: [assets]
      summary: Return an asset to available stock
      parameters:
        - $ref: "#/components/parameters/AssetId"
      responses:
        "200":
          description: Returned asset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetDetail"
        "404":
          $ref: "#/components/responses/NotFound"
  /assets/{assetId}/status:
    post:
      operationId: updateAssetStatus
      tags: [assets]
      summary: Change an asset status
      parameters:
        - $ref: "#/components/parameters/AssetId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssetStatusInput"
      responses:
        "200":
          description: Asset with updated status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetDetail"
        "404":
          $ref: "#/components/responses/NotFound"
  /assets/{assetId}/history:
    get:
      operationId: getAssetHistory
      tags: [assets]
      summary: Get asset history
      parameters:
        - $ref: "#/components/parameters/AssetId"
      responses:
        "200":
          description: Asset history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HistoryEvent"
        "404":
          $ref: "#/components/responses/NotFound"
  /locations:
    get:
      operationId: listLocations
      tags: [locations]
      summary: List asset locations
      responses:
        "200":
          description: Locations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Location"
    post:
      operationId: createLocation
      tags: [locations]
      summary: Create an asset location
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocationInput"
      responses:
        "201":
          description: Created location
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Location"
  /locations/{locationId}:
    patch:
      operationId: updateLocation
      tags: [locations]
      summary: Update an asset location
      parameters:
        - $ref: "#/components/parameters/LocationPathId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocationUpdate"
      responses:
        "200":
          description: Updated location
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Location"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteLocation
      tags: [locations]
      summary: Delete a location (Admin and Manager)
      parameters:
        - $ref: "#/components/parameters/LocationPathId"
      responses:
        "204":
          description: Location removed
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Location still has assets
  /people:
    get:
      operationId: listPeople
      tags: [people]
      summary: List asset custodians
      responses:
        "200":
          description: People
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Person"
    post:
      operationId: createPerson
      tags: [people]
      summary: Create an asset custodian
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PersonInput"
      responses:
        "201":
          description: Created person
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Person"
  /people/{personId}:
    patch:
      operationId: updatePerson
      tags: [people]
      summary: Update an asset custodian
      parameters:
        - $ref: "#/components/parameters/PersonId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PersonUpdate"
      responses:
        "200":
          description: Updated person
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Person"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deletePerson
      tags: [people]
      summary: Delete a person (Admin and Manager)
      parameters:
        - $ref: "#/components/parameters/PersonId"
      responses:
        "204":
          description: Person removed
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Person still has assigned assets
  /departments:
    get:
      operationId: listDepartments
      tags: [departments]
      summary: List departments
      responses:
        "200":
          description: Departments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Department"
    post:
      operationId: createDepartment
      tags: [departments]
      summary: Create a department
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DepartmentInput"
      responses:
        "201":
          description: Created department
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Department"
  /departments/{departmentId}:
    patch:
      operationId: updateDepartment
      tags: [departments]
      summary: Update a department
      parameters:
        - $ref: "#/components/parameters/DepartmentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DepartmentUpdate"
      responses:
        "200":
          description: Updated department
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Department"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteDepartment
      tags: [departments]
      summary: Delete a department (Admin and Manager)
      parameters:
        - $ref: "#/components/parameters/DepartmentId"
      responses:
        "204":
          description: Department removed
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Department still has people
  /maintenance:
    get:
      operationId: listMaintenance
      tags: [maintenance]
      summary: List upcoming maintenance
      parameters:
        - $ref: "#/components/parameters/MaintenanceLimit"
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/MaintenanceStatus"
        - $ref: "#/components/parameters/MaintenanceMode"
        - $ref: "#/components/parameters/MaintenanceScope"
        - $ref: "#/components/parameters/MaintenanceActivityType"
        - $ref: "#/components/parameters/MaintenancePriority"
      responses:
        "200":
          description: Maintenance items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MaintenanceItem"
    post:
      operationId: createMaintenance
      tags: [maintenance]
      summary: Schedule maintenance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MaintenanceInput"
      responses:
        "201":
          description: Scheduled maintenance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaintenanceItem"
  /maintenance/{maintenanceId}:
    patch:
      operationId: updateMaintenance
      tags: [maintenance]
      summary: Update a maintenance item
      parameters:
        - $ref: "#/components/parameters/MaintenanceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MaintenanceUpdate"
      responses:
        "200":
          description: Updated maintenance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaintenanceItem"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteMaintenance
      tags: [maintenance]
      summary: Remove a maintenance item
      parameters:
        - $ref: "#/components/parameters/MaintenanceId"
      responses:
        "204":
          description: Maintenance item removed
        "404":
          $ref: "#/components/responses/NotFound"
  /assets/{assetId}/attachments:
    get:
      operationId: listAssetAttachments
      tags: [attachments]
      summary: List photos on an asset
      parameters:
        - $ref: "#/components/parameters/AssetId"
      responses:
        "200":
          description: Attachments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Attachment"
    post:
      operationId: createAssetAttachment
      tags: [attachments]
      summary: Upload a photo to an asset
      parameters:
        - $ref: "#/components/parameters/AssetId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttachmentInput"
      responses:
        "201":
          description: Created attachment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Attachment"
        "404":
          $ref: "#/components/responses/NotFound"
  /maintenance/{maintenanceId}/attachments:
    get:
      operationId: listMaintenanceAttachments
      tags: [attachments]
      summary: List photos on a maintenance item
      parameters:
        - $ref: "#/components/parameters/MaintenanceId"
      responses:
        "200":
          description: Attachments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Attachment"
    post:
      operationId: createMaintenanceAttachment
      tags: [attachments]
      summary: Upload a photo to a maintenance item
      parameters:
        - $ref: "#/components/parameters/MaintenanceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttachmentInput"
      responses:
        "201":
          description: Created attachment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Attachment"
        "404":
          $ref: "#/components/responses/NotFound"
  /attachments/{attachmentId}:
    delete:
      operationId: deleteAttachment
      tags: [attachments]
      summary: Remove a photo
      parameters:
        - $ref: "#/components/parameters/AttachmentId"
      responses:
        "204":
          description: Attachment removed
        "404":
          $ref: "#/components/responses/NotFound"
  /assets/bulk/status:
    post:
      operationId: bulkUpdateAssetStatus
      tags: [assets]
      summary: Change status for several assets
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkAssetStatusInput"
      responses:
        "200":
          description: Updated assets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Asset"
  /assets/bulk/delete:
    post:
      operationId: bulkDeleteAssets
      tags: [assets]
      summary: Delete several assets (Admin and Manager)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkAssetDeleteInput"
      responses:
        "204":
          description: Assets removed
        "404":
          $ref: "#/components/responses/NotFound"
  /me:
    get:
      operationId: getCurrentUser
      tags: [users]
      summary: Get the current authenticated user and role
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List users (Admin and Manager)
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
    post:
      operationId: createUser
      tags: [users]
      summary: Onboard a user (Admin any role; Manager limited to technician/viewer)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserInput"
      responses:
        "201":
          description: Created user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
  /users/{userId}:
    delete:
      operationId: deleteUser
      tags: [users]
      summary: Delete a team member (Admin only)
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "204":
          description: User removed
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Cannot delete the last Admin or yourself
  /users/{userId}/role:
    patch:
      operationId: updateUserRole
      tags: [users]
      summary: Change a user's role (Admin only)
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserRoleUpdate"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          $ref: "#/components/responses/NotFound"
  /audit/logs:
    get:
      operationId: getAuditLogs
      tags: [audit]
      summary: Consolidated audit / activity log (Admin and Auditor)
      parameters:
        - $ref: "#/components/parameters/ActivitySearch"
        - $ref: "#/components/parameters/ActivityAction"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Audit log entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityEvent"
  /reports:
    get:
      operationId: listComplianceReports
      tags: [reports]
      summary: List compliance reports
      responses:
        "200":
          description: Compliance reports
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ComplianceReport"
    post:
      operationId: createComplianceReport
      tags: [reports]
      summary: Start a compliance report (Admin and Auditor)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ComplianceReportInput"
      responses:
        "201":
          description: Created report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComplianceReport"
  /reports/{reportId}:
    get:
      operationId: getComplianceReport
      tags: [reports]
      summary: Get a compliance report
      parameters:
        - $ref: "#/components/parameters/ReportId"
      responses:
        "200":
          description: Report detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComplianceReport"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateComplianceReport
      tags: [reports]
      summary: Update a report or advance its workflow stage (Admin and Auditor)
      parameters:
        - $ref: "#/components/parameters/ReportId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ComplianceReportUpdate"
      responses:
        "200":
          description: Updated report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComplianceReport"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteComplianceReport
      tags: [reports]
      summary: Delete a compliance report (Admin only)
      parameters:
        - $ref: "#/components/parameters/ReportId"
      responses:
        "204":
          description: Report removed
        "404":
          $ref: "#/components/responses/NotFound"
components:
  parameters:
    AssetId:
      name: assetId
      in: path
      required: true
      schema:
        type: string
    Search:
      name: search
      in: query
      schema:
        type: string
    Status:
      name: status
      in: query
      schema:
        type: string
        enum: [available, assigned, in_repair, rma, retired, lost]
    Category:
      name: category
      in: query
      schema:
        type: string
    LocationId:
      name: locationId
      in: query
      schema:
        type: string
    LocationPathId:
      name: locationId
      in: path
      required: true
      schema:
        type: string
    PersonId:
      name: personId
      in: path
      required: true
      schema:
        type: string
    DepartmentId:
      name: departmentId
      in: path
      required: true
      schema:
        type: string
    AttachmentId:
      name: attachmentId
      in: path
      required: true
      schema:
        type: string
    MaintenanceId:
      name: maintenanceId
      in: path
      required: true
      schema:
        type: string
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
    ReportId:
      name: reportId
      in: path
      required: true
      schema:
        type: string
    ActivityAction:
      name: action
      in: query
      schema:
        type: string
        enum: [assignment, return, alert, import, maintenance, update]
    ActivitySearch:
      name: search
      in: query
      schema:
        type: string
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 12
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 5
    MaintenanceLimit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    MaintenanceStatus:
      name: status
      in: query
      schema:
        type: string
        enum: [pending, scheduled, completed, overdue]
    MaintenanceMode:
      name: mode
      in: query
      schema:
        type: string
        enum: [scheduled, emergency]
    MaintenanceScope:
      name: scope
      in: query
      schema:
        type: string
        enum: [asset, estate]
    MaintenanceActivityType:
      name: activityType
      in: query
      schema:
        type: string
        enum: [os_patch, application_patch, lan, firewall, other]
    MaintenancePriority:
      name: priority
      in: query
      schema:
        type: string
        enum: [high, normal, low]
  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]
    CurrentUser:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        name:
          type: string
        role:
          type: string
          enum: [admin, auditor, manager, technician, viewer]
      required: [id, email, name, role]
    User:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        name:
          type: string
        role:
          type: string
          enum: [admin, auditor, manager, technician, viewer]
        invitedBy:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
      required: [id, email, name, role, invitedBy, createdAt, lastSeenAt]
    UserInput:
      type: object
      properties:
        email:
          type: string
          format: email
        name:
          type: string
          default: ""
        role:
          type: string
          enum: [admin, auditor, manager, technician, viewer]
      required: [email, role]
    UserRoleUpdate:
      type: object
      properties:
        role:
          type: string
          enum: [admin, auditor, manager, technician, viewer]
      required: [role]
    ComplianceReport:
      type: object
      properties:
        id:
          type: string
        title:
