openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: dashboard
    description: Command center dashboard data
  - name: assets
    description: Asset inventory and lifecycle operations
  - name: maintenance
    description: Maintenance schedule data
  - name: locations
    description: Managed asset locations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get dashboard summary
      responses:
        "200":
          description: Current inventory summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /dashboard/activity:
    get:
      operationId: getDashboardActivity
      tags: [dashboard]
      summary: Get recent asset activity
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/ActivityAction"
        - $ref: "#/components/parameters/ActivitySearch"
      responses:
        "200":
          description: Recent activity entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityEvent"
  /dashboard/maintenance:
    get:
      operationId: getDashboardMaintenance
      tags: [dashboard]
      summary: Get upcoming maintenance
      parameters:
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Upcoming maintenance rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MaintenanceItem"
  /assets:
    get:
      operationId: listAssets
      tags: [assets]
      summary: List and filter assets
      parameters:
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Status"
        - $ref: "#/components/parameters/Category"
        - $ref: "#/components/parameters/LocationId"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Paginated asset list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetListResponse"
    post:
      operationId: createAsset
      tags: [assets]
      summary: Create an asset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssetInput"
      responses:
        "201":
          description: Created asset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"
  /assets/{assetId}:
    get:
      operationId: getAsset
      tags: [assets]
      summary: Get an asset
      parameters:
        - $ref: "#/components/parameters/AssetId"
      responses:
        "200":
          description: Asset details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetDetail"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateAsset
      tags: [assets]
      summary: Update an asset
      parameters:
        - $ref: "#/components/parameters/AssetId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssetUpdate"
      responses:
        "200":
          description: Updated asset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"
        "404":
          $ref: "#/components/responses/NotFound"
  /assets/{assetId}/assign:
    post:
      operationId: assignAsset
      tags: [assets]
      summary: Assign an asset to a person and location
      parameters:
        - $ref: "#/components/parameters/AssetId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssetAssignmentInput"
      responses:
        "200":
          description: Assigned asset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetDetail"
        "404":
          $ref: "#/components/responses/NotFound"
  /assets/{assetId}/return:
    post:
      operationId: returnAsset
      tags: [assets]
      summary: Return an asset to available stock
      parameters:
        - $ref: "#/components/parameters/AssetId"
      responses:
        "200":
          description: Returned asset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetDetail"
        "404":
          $ref: "#/components/responses/NotFound"
  /assets/{assetId}/status:
    post:
      operationId: updateAssetStatus
      tags: [assets]
      summary: Change an asset status
      parameters:
        - $ref: "#/components/parameters/AssetId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssetStatusInput"
      responses:
        "200":
          description: Asset with updated status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetDetail"
        "404":
          $ref: "#/components/responses/NotFound"
  /assets/{assetId}/history:
    get:
      operationId: getAssetHistory
      tags: [assets]
      summary: Get asset history
      parameters:
        - $ref: "#/components/parameters/AssetId"
      responses:
        "200":
          description: Asset history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HistoryEvent"
        "404":
          $ref: "#/components/responses/NotFound"
  /locations:
    get:
      operationId: listLocations
      tags: [locations]
      summary: List asset locations
      responses:
        "200":
          description: Locations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Location"
    post:
      operationId: createLocation
      tags: [locations]
      summary: Create an asset location
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocationInput"
      responses:
        "201":
          description: Created location
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Location"
  /locations/{locationId}:
    patch:
      operationId: updateLocation
      tags: [locations]
      summary: Update an asset location
      parameters:
        - $ref: "#/components/parameters/LocationPathId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocationUpdate"
      responses:
        "200":
          description: Updated location
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Location"
        "404":
          $ref: "#/components/responses/NotFound"
  /people:
    get:
      operationId: listPeople
      tags: [people]
      summary: List asset custodians
      responses:
        "200":
          description: People
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Person"
    post:
      operationId: createPerson
      tags: [people]
      summary: Create an asset custodian
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PersonInput"
      responses:
        "201":
          description: Created person
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Person"
  /people/{personId}:
    patch:
      operationId: updatePerson
      tags: [people]
      summary: Update an asset custodian
      parameters:
        - $ref: "#/components/parameters/PersonId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PersonUpdate"
      responses:
        "200":
          description: Updated person
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Person"
        "404":
          $ref: "#/components/responses/NotFound"
  /maintenance:
    get:
      operationId: listMaintenance
      tags: [maintenance]
      summary: List upcoming maintenance
      parameters:
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Maintenance items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MaintenanceItem"
    post:
      operationId: createMaintenance
      tags: [maintenance]
      summary: Schedule maintenance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MaintenanceInput"
      responses:
        "201":
          description: Scheduled maintenance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaintenanceItem"
  /maintenance/{maintenanceId}:
    patch:
      operationId: updateMaintenance
      tags: [maintenance]
      summary: Update a maintenance item
      parameters:
        - $ref: "#/components/parameters/MaintenanceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MaintenanceUpdate"
      responses:
        "200":
          description: Updated maintenance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaintenanceItem"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteMaintenance
      tags: [maintenance]
      summary: Remove a maintenance item
      parameters:
        - $ref: "#/components/parameters/MaintenanceId"
      responses:
        "204":
          description: Maintenance item removed
        "404":
          $ref: "#/components/responses/NotFound"
  /assets/bulk/status:
    post:
      operationId: bulkUpdateAssetStatus
      tags: [assets]
      summary: Change status for several assets
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkAssetStatusInput"
      responses:
        "200":
          description: Updated assets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Asset"
components:
  parameters:
    AssetId:
      name: assetId
      in: path
      required: true
      schema:
        type: string
    Search:
      name: search
      in: query
      schema:
        type: string
    Status:
      name: status
      in: query
      schema:
        type: string
        enum: [available, assigned, in_repair, rma, retired, lost]
    Category:
      name: category
      in: query
      schema:
        type: string
    LocationId:
      name: locationId
      in: query
      schema:
        type: string
    LocationPathId:
      name: locationId
      in: path
      required: true
      schema:
        type: string
    PersonId:
      name: personId
      in: path
      required: true
      schema:
        type: string
    MaintenanceId:
      name: maintenanceId
      in: path
      required: true
      schema:
        type: string
    ActivityAction:
      name: action
      in: query
      schema:
        type: string
        enum: [assignment, return, alert, import, maintenance, update]
    ActivitySearch:
      name: search
      in: query
      schema:
        type: string
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 12
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 5
  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]
    DashboardSummary:
      type: object
      properties:
        total:
          type: integer
        assigned:
          type: integer
        inRepair:
          type: integer
        available:
          type: integer
        utilization:
          type: integer
        changes:
          type: object
          properties:
            total:
              type: integer
            assigned:
              type: integer
            inRepair:
              type: integer
          required: [total, assigned, inRepair]
      required: [total, assigned, inRepair, available, utilization, changes]
    Location:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        city:
          type: string
        assetCount:
          type: integer
      required: [id, name, city, assetCount]
    Person:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        department:
          type: string
        email:
          type: string
      required: [id, name, department, email]
    PersonInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        department:
          type: string
          minLength: 1
        email:
          type: string
          format: email
      required: [name, department, email]
    PersonUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        department:
          type: string
          minLength: 1
        email:
          type: string
          format: email
    LocationInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        city:
          type: string
          minLength: 1
      required: [name, city]
    LocationUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        city:
          type: string
          minLength: 1
    Asset:
      type: object
      properties:
        id:
          type: string
        assetTag:
          type: string
        name:
          type: string
        category:
          type: string
        manufacturer:
          type: string
        model:
          type: string
        serialNumber:
          type: string
        status:
          type: string
          enum: [available, assigned, in_repair, rma, retired, lost]
        condition:
          type: string
          enum: [excellent, good, fair, poor]
        location:
          $ref: "#/components/schemas/Location"
        assignee:
          anyOf:
            - $ref: "#/components/schemas/Person"
            - type: "null"
        warrantyEnd:
          type: ["string", "null"]
          format: date
        purchaseDate:
          type: ["string", "null"]
          format: date
        purchaseCost:
          type: ["number", "null"]
        lastUpdated:
          type: string
          format: date-time
      required:
        - id
        - assetTag
        - name
        - category
        - manufacturer
        - model
        - serialNumber
        - status
        - condition
        - location
        - assignee
        - warrantyEnd
        - purchaseDate
        - purchaseCost
        - lastUpdated
    AssetDetail:
      allOf:
        - $ref: "#/components/schemas/Asset"
        - type: object
          properties:
            notes:
              type: string
            specifications:
              type: object
              additionalProperties:
                type: string
            history:
              type: array
              items:
                $ref: "#/components/schemas/HistoryEvent"
          required: [notes, specifications, history]
    AssetInput:
      type: object
      properties:
        assetTag:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
        category:
          type: string
          minLength: 1
        manufacturer:
          type: string
          minLength: 1
        model:
          type: string
          minLength: 1
        serialNumber:
          type: string
          minLength: 1
        status:
          type: string
          enum: [available, assigned, in_repair, rma, retired, lost]
          default: available
        condition:
          type: string
          enum: [excellent, good, fair, poor]
          default: good
        locationId:
          type: string
        warrantyEnd:
          type: ["string", "null"]
          format: date
        purchaseDate:
          type: ["string", "null"]
          format: date
        purchaseCost:
          type: ["number", "null"]
        notes:
          type: string
          default: ""
      required: [assetTag, name, category, manufacturer, model, serialNumber, locationId]
    AssetUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        category:
          type: string
        manufacturer:
          type: string
        model:
          type: string
        serialNumber:
          type: string
        condition:
          type: string
          enum: [excellent, good, fair, poor]
        locationId:
          type: string
        warrantyEnd:
          type: ["string", "null"]
          format: date
        purchaseDate:
          type: ["string", "null"]
          format: date
        purchaseCost:
          type: ["number", "null"]
        notes:
          type: string
    AssetAssignmentInput:
      type: object
      properties:
        personId:
          type: string
        locationId:
          type: string
      required: [personId, locationId]
    AssetStatusInput:
      type: object
      properties:
        status:
          type: string
          enum: [available, assigned, in_repair, rma, retired, lost]
        note:
          type: string
          default: ""
      required: [status]
    AssetListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Asset"
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer
      required: [items, total, page, pageSize]
    ActivityEvent:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum: [assignment, return, alert, import, maintenance, update]
        message:
          type: string
        actor:
          type: string
        createdAt:
          type: string
          format: date-time
        assetTag:
          type: ["string", "null"]
      required: [id, type, message, actor, createdAt, assetTag]
    HistoryEvent:
      type: object
      properties:
        id:
          type: string
        action:
          type: string
        detail:
          type: string
        actor:
          type: string
        createdAt:
          type: string
          format: date-time
      required: [id, action, detail, actor, createdAt]
    MaintenanceItem:
      type: object
      properties:
        id:
          type: string
        assetTag:
          type: string
        category:
          type: string
        scheduledAt:
          type: string
          format: date-time
        technician:
          type: string
        priority:
          type: string
          enum: [high, normal, low]
        status:
          type: string
          enum: [pending, scheduled, completed, overdue]
      required: [id, assetTag, category, scheduledAt, technician, priority, status]
    MaintenanceInput:
      type: object
      properties:
        assetId:
          type: string
        scheduledAt:
          type: string
          format: date-time
        technician:
          type: string
          minLength: 1
        priority:
          type: string
          enum: [high, normal, low]
          default: normal
        status:
          type: string
          enum: [pending, scheduled, completed, overdue]
          default: scheduled
      required: [assetId, scheduledAt, technician]
    MaintenanceUpdate:
      type: object
      properties:
        scheduledAt:
          type: string
          format: date-time
        technician:
          type: string
          minLength: 1
        priority:
          type: string
          enum: [high, normal, low]
        status:
          type: string
          enum: [pending, scheduled, completed, overdue]
    BulkAssetStatusInput:
      type: object
      properties:
        assetIds:
          type: array
          minItems: 1
          items:
            type: string
        status:
          type: string
          enum: [available, assigned, in_repair, rma, retired, lost]
        note:
          type: string
          default: ""
      required: [assetIds, status]

